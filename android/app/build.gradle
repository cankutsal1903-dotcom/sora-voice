// EAS Build bu satırı ve dosyayı bulut derlemesi sırasında kendisi ekler.
// Dosya yalnızca bulutta var olduğu için satırı yerelde eklerseniz Gradle
// yapılandırma aşamasında dosyayı bulamaz ve DEBUG dahil tüm derlemeler kırılır.
