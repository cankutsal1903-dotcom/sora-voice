name: Android Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main, fix/gift-send-effects-20261116]

permissions:
  contents: read

concurrency:
  group: android-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_TOKEN_SERVER_URL: ${{ vars.EXPO_PUBLIC_TOKEN_SERVER_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_ERROR_REPORTING_ENABLED: ${{ vars.EXPO_PUBLIC_ERROR_REPORTING_ENABLED }}
      EXPO_PUBLIC_BANK_ACCOUNT_HOLDER: ${{ vars.EXPO_PUBLIC_BANK_ACCOUNT_HOLDER }}
      EXPO_PUBLIC_BANK_NAME: ${{ vars.EXPO_PUBLIC_BANK_NAME }}
      EXPO_PUBLIC_BANK_IBAN: ${{ vars.EXPO_PUBLIC_BANK_IBAN }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Yapılandırmayı doğrula
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$EXPO_PUBLIC_TOKEN_SERVER_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: İmzalama anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sora-release.jks"

      - name: Android SDK yolunu tanımla
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Release AAB üret
        working-directory: android
        env:
          SORA_RELEASE_STORE_FILE: ${{ runner.temp }}/sora-release.jks
          SORA_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SORA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SORA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: AAB imzasını ve izinleri doğrula
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          python3 -c '
          import zipfile
          with zipfile.ZipFile("android/app/build/outputs/bundle/release/app-release.aab") as z:
              raw = z.read("base/manifest/AndroidManifest.xml")
          assert b"FOREGROUND_SERVICE" not in raw, "Unexpected FOREGROUND_SERVICE permission remained in manifest"
          print("MANIFEST_CLEAN_NO_FGS_OK")
          '

      - name: AAB paketini indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: Sora-bundle-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
